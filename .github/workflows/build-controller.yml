name: Build and publish controller images
on:
  push:
    paths:
      - "controller/**"
      - "join-patterns/**"
      - "charts/**"
      - ".github/workflows/publish-chart.yml"
      - ".github/workflows/build-controller.yml"
  workflow_dispatch:
    inputs:
      publish_dialer_release:
        description: Publish raw binaries after release qualification
        type: boolean
        default: false
env:
  REGISTRY: ghcr.io
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [endpoint-controller, dialer]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Cross-compile image binaries
        run: bash controller/build-binaries.sh "${{ runner.temp }}/image-binaries" "${{ matrix.target }}" amd64 arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          target: ${{ matrix.target }}
          build-contexts: |
            binaries=${{ runner.temp }}/image-binaries
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The Windows peer publisher (windowsPublisher.image). Its final stage
  # only copies the cross-compiled executable onto the HostProcess base, so
  # buildx builds it on a Linux runner.
  windows-publisher:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-windows-publisher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile.windows-publisher
          platforms: windows/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Per-arch raw dialer binaries: a fresh cloud instance has no
  # container runtime when cloud-init runs, so its userdata downloads
  # exactly one of these and verifies the sha256 the join reconciler
  # pinned at render time (--join-dialer-binary-url-*/-sha256-*).
  # Published as a GitHub release per commit SHA so the URL is stable,
  # public, and content-addressed by the workflow that produced it.
  dialer-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Build static per-arch dialer binaries
        working-directory: controller
        env:
          DIALER_DIST: ${{ runner.temp }}/dialer-dist
        run: |
          set -euo pipefail
          bash build-binaries.sh "$DIALER_DIST" dialer arm64 amd64
          for arch in arm64 amd64; do
            go version -m "$DIALER_DIST/wg-dialer-linux-$arch" | grep -F 'vcs.modified=false'
          done
          (cd "$DIALER_DIST" && sha256sum wg-dialer-linux-arm64 wg-dialer-linux-amd64 | tee SHA256SUMS)
      - name: Retain raw binaries and checksums
        uses: actions/upload-artifact@v4
        with:
          name: dialer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dialer-dist/wg-dialer-linux-*
            ${{ runner.temp }}/dialer-dist/SHA256SUMS
      - name: Publish release dialer-${{ github.sha }}
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dialer_release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIALER_DIST: ${{ runner.temp }}/dialer-dist
        run: |
          set -euo pipefail
          tag="dialer-${GITHUB_SHA::7}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "wg-dialer static binaries for $GITHUB_SHA. Pin the matching SHA256SUMS entries into --join-dialer-binary-sha256-*." \
            "$DIALER_DIST/wg-dialer-linux-arm64" "$DIALER_DIST/wg-dialer-linux-amd64" "$DIALER_DIST/SHA256SUMS"
