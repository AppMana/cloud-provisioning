# Templated on-prem DaemonSet for the green scenarios. The driver
# script substitutes $DIALER_BINARY, $IFACE, $POD_CIDRS and
# $SERVICE_CIDRS via envsubst before applying. It matches the real
# endpoint-controller's ensureDialerDaemonSet shape (hostNetwork,
# NET_ADMIN, Secret mode, self-generated node-local key) closely enough
# to exercise the same kernel-level behavior. This harness runs the
# dialer binary directly rather than through the controller's reconcile
# loop, since what is under test is the dialer's kernel behavior on a
# booted system, not the controller's reconcile logic, which is the
# kind e2e's job.
#
# The dialer generates its own WireGuard key under /var/lib/
# cloud-provisioning on first start and publishes only the public key
# into the wg-dialer-peer Secret. The driver script then renders the
# cloud side's peers.json from that published key, proving the
# no-manual-key-material flow end to end on a real kubelet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dialer-repro
  namespace: wg-dialer
spec:
  selector:
    matchLabels:
      app: dialer-repro
  template:
    metadata:
      labels:
        app: dialer-repro
    spec:
      hostNetwork: true
      # No control-plane exclusion here: this harness's single onprem
      # node is controller+worker and is the explicitly-selected tunnel
      # endpoint (the selector-override case). The production default
      # posture, control planes excluded unless named, is rendered
      # by the endpoint-controller and asserted by harness/kind-e2e.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
      containers:
        - name: dialer
          image: busybox
          command: ["/host-bin/$DIALER_BINARY"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - --secret-namespace=wg-dialer
            - --secret-name=wg-dialer-peer
            - --iface=$IFACE
            - --private-key-file=/host-key/private.key
            - --pod-cidrs=$POD_CIDRS
            - --service-cidrs=$SERVICE_CIDRS
            - --keepalive-seconds=15
            - --mtu=1420
            - --poll-interval=10s
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: hostbin
              mountPath: /host-bin
            - name: dialer-key
              mountPath: /host-key
      volumes:
        - name: hostbin
          hostPath:
            path: /opt/dialer-bin
        - name: dialer-key
          hostPath:
            path: /var/lib/cloud-provisioning
            type: DirectoryOrCreate
