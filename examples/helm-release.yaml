# Default HelmRelease: Full-Mesh WireGuard Tunnel (every on-premises node + all remote cloud nodes)
#
# Remote cloud workers ALWAYS run the WireGuard tunnel (they can never be omitted).
# By default, tunnel.endpoints is "all", which places the tunnel on every on-premises
# Linux node (both control-plane and worker nodes) as well.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloud-provisioning
  namespace: cloud-provisioning
spec:
  interval: 10m
  url: oci://ghcr.io/appmana/charts/cloud-provisioning
  ref:
    tag: 0.1.23
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloud-provisioning
  namespace: cloud-provisioning
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cloud-provisioning
  values:
    # joinProvider (k0s, k3s, rke2, microk8s, kubeadm), site CNI, and API address
    # are inferred automatically from the cluster at startup.
    # ProvisionedNodeGroupClaim (nodeGroups: true) and the mutating admission
    # webhook (webhook.enabled: true) are enabled by default.
    tunnel:
      # "all" (the default) places the tunnel on every on-premises Linux node
      # alongside all remote cloud workers (full mesh).
      endpoints: "all"
    webhook:
      aws:
        # Optional: default AWSClusterStaticIdentity / AWSClusterRoleIdentity name
        # patched onto AWSClusters when spec.identityRef is omitted.
        # (Security groups and VPC/subnet selection are resolved and created
        # automatically in the target VPC by the controller.)
        identityName: "site-aws-identity"
    aws:
      credentials:
        # Secret in `cloud-provisioning` holding least-privilege runtime controller
        # credentials (see `docs/iam/controller.json`) for VPC/subnet discovery,
        # automatic security group lifecycle (`cloud-provisioning-<cluster>`), and
        # native AWS VPC CNI pod IP observation.
        secretName: "aws-controller-credentials"
