apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vpc-resource-controller
    control-plane: controller
  name: vpc-resource-local-controller
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller
  template:
    metadata:
      labels:
        app: vpc-resource-controller
        control-plane: controller
    spec:
      containers:
      - args:
        - --cluster-name=CLUSTER_NAME
        - --role-arn=USER_ROLE_ARN
        - --leader-elect
        - --metrics-bind-address=:8443
        - --introspect-bind-addr=:22775
        - --vpc-id=VPC_ID
        image: controller@latest
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 61779
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 30
        name: controller
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8443
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: 0.5
            memory: 1Gi
          requests:
            cpu: 0.3
            memory: 400Mi
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: vpc-resource-controller
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
      - name: aws-iam-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 86400
              path: token
