{{- /*
RBAC derived from the controller's actual API calls. Namespaces are the
release namespace; the bootstrap-secret Role is bound in whatever
namespace the CAPI Machines live in (.Values.machineNamespace).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
  namespace: {{ .Release.Namespace }}
---
# The dialer DaemonSets' identity (both on-prem and cloud pods): reads
# the peer Secret, publishes the node's own public key into it, and
# (cloud side) reads its machine's adoption Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud-provisioning.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
rules:
  # Watch/annotate Machines (join + mesh reconcilers); the claim
  # reconciler also creates them.
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    # delete: the claim tears down its own compute. OwnerRef GC does
    # not suffice, because CAPI's Machine controller replaces the
    # claim's ownerReference with the Cluster.
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # resolveCluster (claim reconciler).
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  # A Cluster annotated managed-by: external gets no status from
  # Cluster API's own controllers, and Machines block until it has
  # one. This controller is that external manager, so it reports the
  # status instead of an operator running `kubectl patch` after every
  # install.
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters/status"]
    verbs: ["get", "patch"]
  # Provider machine objects: read (join reconciler waits on
  # existence), create (claim reconciler). CAPA cluster/identity
  # objects: read-only preflight (aws.Provider.Validate).
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["awsmachines", "dockermachines"]
    verbs: ["get", "create", "delete"]
  # Read across the whole infrastructure group. A claim names its
  # machine template by apiGroup and kind, and the machine created is
  # that kind without the Template suffix, so which resources exist is
  # the provider's choice rather than something this chart can list.
  # Reads only: the writes above stay limited to the machine kinds.
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Same reason as clusters/status above.
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["awsclusters/status", "dockerclusters/status"]
    verbs: ["get", "patch"]
  # The claim CRD itself.
  - apiGroups: ["cloud-provisioning.appmana.com"]
    resources: ["provisionednodeclaims"]
    # update: the reconciler adds/removes its own finalizer so a claim
    # cannot be deleted while the compute it created still exists.
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["cloud-provisioning.appmana.com"]
    resources: ["provisionednodeclaims/status"]
    verbs: ["update"]
  # Tunnel-endpoint allocation watches Nodes (a new/relabeled node
  # changes the mesh membership).
  # Reading the cluster's own addresses and ranges, so none of them
  # have to be restated as configuration.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["servicecidrs"]
    verbs: ["get", "list"]
  # The service range on a cluster too old for ServiceCIDR objects is
  # read from the allocator's rejection of an out-of-range address. The
  # request is a dry run, so nothing is created.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  # Which network is installed, how it carries pod traffic, and which
  # blocks it gave each node. All of it read from the network's own
  # records, because they are what it routes by.
  - apiGroups: ["crd.projectcalico.org"]
    resources: ["ippools", "blockaffinities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    # patch: a provisioned node is told which address the CNI should
    # peer on, and stamped with the claim that produced it.
    # delete: that claim's teardown removes it, since nothing else
    # will (a cluster-scoped Node cannot be owned by a namespaced
    # claim, and Cluster API only removes nodes for clusters it
    # manages).
    verbs: ["get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloud-provisioning.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
---
# Everything the controller does with Secrets and DaemonSets happens in
# its own namespace: the peer Secret (get/patch), per-machine adoption
# Secrets (get/create/patch), the AWS provider-config Secret (get), and
# both dialer DaemonSets (get/create/update).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "create", "update"]
  # Its own Deployment: everything the controller creates at runtime is
  # owned by it, so uninstalling the release collects those objects
  # instead of leaving DaemonSets running with nothing behind them.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
---
# Bootstrap Secrets are created in whatever namespace the Machines live
# in (they're owned by the Machines). Bind this in that namespace,
# shown here for "default"; duplicate per Machine namespace if you use
# another.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-bootstrap-secrets
  namespace: {{ .Values.machineNamespace | default "default" }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-bootstrap-secrets
  namespace: {{ .Values.machineNamespace | default "default" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.controllerName" . }}-bootstrap-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
---
# The k0s join flow (pkg/join/k0s): mints a bootstrap-token Secret in
# kube-system, reads kube-root-ca.crt, and lists one Node to discover
# the k0s version.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-join
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kube-root-ca.crt"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-join
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.controllerName" . }}-join
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
---
# The dialer pods' own access: the peer Secret (read the mesh state,
# merge-patch their self-published public key) and, on the cloud node,
# the per-machine adoption Secret (read-only; its name is derived from
# /etc/wg-dialer/machine-name, so this cannot be resourceName-scoped).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.name" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.name" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.providerManagerNamespace }}
{{- /* Only when the AWS provider is configured: this Role lives in
CAPA's manager namespace, which does not exist in a cluster that
installs a different infrastructure provider, and rendering it
unconditionally makes the chart uninstallable there.

The AWS provider's preflight check (aws.Provider.Validate) resolves an
AWSClusterStaticIdentity's secretRef against CAPA's own manager
namespace, which is where CAPA looks regardless of where the
AWSCluster lives. Without read access there the check cannot verify
the credential and errors out instead of passing, which blocks every
bootstrap render. Read-only, one namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-read-provider-credentials
  namespace: {{ .Values.providerManagerNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-read-provider-credentials
  namespace: {{ .Values.providerManagerNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.controllerName" . }}-read-provider-credentials
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
