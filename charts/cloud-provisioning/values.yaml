# Default values for cloud-provisioning.

nameOverride: ""

image:
  repository: ghcr.io/appmana/cloud-provisioning-endpoint-controller
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
# Image the operator renders into both dialer DaemonSets. Pin by digest
# in production; a tag is fine when the image is preloaded on the node.
dialerImage:
  repository: ghcr.io/appmana/cloud-provisioning-dialer
  tag: ""            # defaults to .Chart.AppVersion

imagePullSecrets: []

# The remote node's DaemonSet. A remote cannot be preloaded and may
# have no registry credential, so if the project image is not publicly
# pullable its adoption DaemonSet ImagePullBackOffs and the node stays
# on its frozen bootstrap peer list, and config changes do not reach
# it. Setting a public base image here makes it execute the host binary
# that cloud-init already installed and sha-verified. Leave empty when
# the project image is pullable; then the DaemonSet also self-installs
# onto the host, which is the post-join upgrade channel.
dialerCloud:
  image: ""             # e.g. busybox:1.37
  hostBinary: /host-bin/wg-dialer

# Every workload this chart owns is Linux-only. Without this, a mixed
# cluster schedules a linux-only controller onto a Windows node and it
# fails with "no match for platform in manifest". The same default is
# pushed into the Cluster API subchart below.
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
# Optional: pin the controller to a specific node (e.g. when the
# images are preloaded there rather than pullable from a registry).
nodeName: ""

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

# Read from the cluster at startup. Set one only to override what was
# discovered.
cluster:
  # Where a joining node reaches the API. Discovered from the
  # kubernetes Service's endpoints, which name every control plane.
  apiAddress: ""     # e.g. https://198.51.100.10:6443

# Pod addressing is not configured here at all. Which network is
# installed, whether it encapsulates, and which blocks it gave each node
# are read from that network's own records every reconcile, so a block
# allocated later reaches the peers without anything being restated.
# Calico, Cilium, Flannel and kube-router are understood.

tunnel:
  # Node selector (k=v,k2=v2) choosing which local nodes terminate
  # tunnels. Empty selects every Linux worker; control planes are
  # excluded unless named explicitly. Only the selected nodes get a
  # cldt* interface.
  endpoints: ""

# The namespace an infrastructure provider's controller runs in, when
# this controller needs to read a credentials Secret there to check a
# cluster identity before provisioning. Empty grants no such access.
providerManagerNamespace: ""   # e.g. capa-system

# Cluster-level configuration for the docker provider, which fulfills a
# claim as a local container and is how the end to end harness
# exercises the whole path without a cloud account.
provider:
  docker:
    nodeImage: ""
    extraMounts: ""     # host:container, comma-separated
    preloadImages: ""   # comma-separated local image refs

# Which cluster technology mints join credentials (k0s | kubeadm).
joinProvider: k0s

# First-boot binary delivery. A remote node has no image puller before
# it joins, so cloud-init fetches this sha-pinned binary; afterwards
# the DaemonSet image is the upgrade channel.
dialerBinary:
  arm64:
    url: ""
    sha256: ""
  amd64:
    url: ""
    sha256: ""

# Standard containernetworking plugins for provisioned nodes. A
# cluster's CNI config may chain bandwidth/portmap/tuning; calico-node
# installs only its own and a stock cloud image ships none, so without
# these every pod sandbox on a provisioned node fails. Optional, but a
# URL without its sha256 is ignored rather than fetched unverified.
cniPlugins:
  arm64:
    url: ""
    sha256: ""
  amd64:
    url: ""
    sha256: ""

# Cluster API, available as an optional subchart for a one-release
# install. It is disabled by default, and the recommended production
# layout is a separate HelmRelease for cluster-api-operator: coupling
# the two lifecycles means a failed upgrade of this chart can delete
# the provider namespaces, and with them the provider controllers and
# the credentials Secrets that live there. See the gitops example in
# the README.
cluster-api-operator:
  enabled: false
  # Same Linux-only reasoning as above.
  nodeSelector:
    kubernetes.io/os: linux
  cert-manager:
    enabled: false   # most clusters already run cert-manager
  # Providers the operator installs, as objects keyed by provider name
  # (the subchart's schema requires objects, not strings). Set an
  # infrastructure provider per environment, e.g.:
  #   infrastructure:
  #     aws:
  #       namespace: capa-system
  #       version: v2.13.0
  # AWS additionally needs a credentials Secret the operator references.
  # deployment.nodeSelector is passed straight through to the Provider
  # CR, which is the only way the provider's own controller gets one:
  # the operator renders those Deployments from upstream manifests,
  # which carry no OS selector. Without this a linux-only provider
  # controller lands on a Windows node and ImagePullBackOffs with "no
  # match for platform in manifest".
  core:
    cluster-api:
      namespace: capi-system
      deployment:
        nodeSelector:
          kubernetes.io/os: linux
  infrastructure: {}
  # This project renders its own bootstrap data (the join-pattern
  # cloud-config becomes the Machine's dataSecretName directly), and
  # the target cluster's control plane is externally managed, so
  # neither the kubeadm bootstrap provider nor the kubeadm
  # control-plane provider is needed. If an environment does want
  # them, give each a deployment.nodeSelector too, for the same
  # Windows-node reason.
  bootstrap: {}
  controlPlane: {}
