# Publish only after the matching main-branch image build succeeds.
# Checkout that exact source revision so appVersion names available images.
name: Publish Helm chart
on:
  workflow_run:
    workflows: [Build and publish controller images]
    types: [completed]
    branches: [main]
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: helm registry login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
      - name: Package and push
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          # The images are tagged with the commit SHA, and the chart's
          # templates default every image tag to .Chart.AppVersion.
          helm repo add cluster-api-operator https://kubernetes-sigs.github.io/cluster-api-operator
          helm dependency build charts/cloud-provisioning
          helm lint charts/cloud-provisioning
          python3 .github/test_chart_publication.py
          base_version="$(helm show chart charts/cloud-provisioning | awk '/^version:/ {print $2}')"
          test -n "$base_version"
          chart_version="${base_version}-sha.${{ github.event.workflow_run.head_sha }}"
          helm package charts/cloud-provisioning --version "$chart_version" --app-version "$sha" --destination /tmp/chart
          helm push /tmp/chart/cloud-provisioning-*.tgz oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
