# Default values for cloud-provisioning.

nameOverride: ""

image:
  repository: ghcr.io/appmana/cloud-provisioning-endpoint-controller
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # sha256:<64 lowercase hex>; takes precedence over tag
  pullPolicy: IfNotPresent
# Image the operator renders into both dialer DaemonSets. Pin by digest
# in production; a tag is fine when the image is preloaded on the node.
dialerImage:
  pullPolicy: IfNotPresent # Never requires images preloaded into each node runtime
  repository: ghcr.io/appmana/cloud-provisioning-dialer
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # sha256:<64 lowercase hex>; takes precedence over tag

# Pass every reference to the controller and its managed agent DaemonSets.
# Separate repositories may require different restricted credentials.
imagePullSecrets: []

# The remote node's DaemonSet. Remotes without a preloaded image need
# registry access. If the project image cannot be pulled, the adoption
# DaemonSet ImagePullBackOffs and the node stays
# on its frozen bootstrap peer list, and config changes do not reach
# it. Setting a public base image here makes it execute the host binary
# that cloud-init already installed and sha-verified. Leave empty when
# the project image is pullable; then the DaemonSet also self-installs
# onto the host, which is the post-join upgrade channel.
dialerCloud:
  image: ""             # e.g. busybox:1.37
  hostBinary: /host-bin/wg-dialer

windowsBootstrap:
  nativePodRouting: false # requires matching native CNI gateway configuration and qualification
  tunnelSHA256: ""  # enables the k0s prepared-image Windows bootstrap renderer
  workerVersion: "" # optional patched build of the same base k0s release
  workerSHA256: ""  # required with workerVersion; exact baked executable hash

windowsPublisher:
  apiServer: ""  # Windows host-reachable API URL; k0s Traefik commonly uses https://[::1]:7443
  image: ""  # digest-pinned HostProcess image; opt-in while Windows joining is validated

# The controller and Cluster API workloads are Linux-only. Without this, a mixed
# cluster schedules a linux-only controller onto a Windows node and it
# fails with "no match for platform in manifest". The same default is
# pushed into the Cluster API subchart below.
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
siteDialer:
  # Additional admission labels for privileged site agents, including transit
  # agents on control planes. Empty preserves the existing all-Linux behavior.
  # Endpoint placement alone does not limit where site agents run.
  nodeSelector: {}
# Optional: pin the controller to a specific node (e.g. when the
# images are preloaded there rather than pullable from a registry).
nodeName: ""

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

# Read from the cluster at startup. Set one only to override what was
# discovered.
cluster:
  # Where a joining node reaches the API. Discovered from the
  # kubernetes Service's endpoints, which name every control plane.
  apiAddress: ""     # e.g. https://198.51.100.10:6443

# Pod addressing is not configured here at all. Which network is
# installed, whether it encapsulates, and which blocks it gave each node
# are read from that network's own records every reconcile, so a block
# allocated later reaches the peers without anything being restated.
# Calico, Cilium, Flannel and kube-router are understood.

tunnel:
  # Experimental receiver preparation: {nativeCIDRs: [...], ports: [...]}.
  # Supply complete protected cloud network ranges and UDP ports already
  # permitted by the worker security groups. Requires receiver-capable agents.
  # Freezes ordinary peer updates and retains endpoints. Without journal receipt
  # serving, preparation is additive and does not switch traffic.
  # Optional journal: {roundLifetime: <duration>, maxReceiptAge: <duration>,
  # drainInterval: <duration>} persists the initial phase. Optional journal.receipts
  # enables authenticated advancement: bindAddress, certFile, keyFile, imageIDs
  # (architecture -> pinned runtime image ID). TLS files must be tls.crt/tls.key
  # under /etc/cloud-provisioning/receipts. Agents require matching CA trust.
  receivePreparation: {}
  # TLS Secret (tls.crt, tls.key, ca.crt) the receipt server presents; it must
  # cover <controller-name>-receipts.<namespace>.svc. Agents project only
  # ca.crt alongside a separate audience-bound token. Empty has the chart issue
  # one through cert-manager from a CA of its own (cert-manager must be
  # installed); cert-manager renews it, and the controller serves a renewed
  # certificate without restarting.
  receiptTLSSecret: ""
  # Node selector (k=v,k2=v2) choosing which local nodes terminate
  # tunnels. Empty selects every Linux worker; control planes are
  # excluded unless the selector names the role label the distribution
  # puts on them (node-role.kubernetes.io/control-plane, or
  # node.k0sproject.io/role=control-plane on k0s, or
  # node.kubernetes.io/microk8s-controlplane on MicroK8s), or is "all".
  # Only the selected nodes get a cldt* interface.
  endpoints: ""

  # How long a node that has left the selector goes on being an
  # endpoint: its dialer stays scheduled, its entries stay published,
  # its tunnel keeps carrying traffic. A remote reads its peer list from
  # the API server and reaches the API server over the tunnel, so
  # withdrawing the old endpoint in the same pass that names the new one
  # removes the only path the new one's name could travel by. This is
  # the time a remote is given to read it, so it is measured in the
  # dialer's 30s poll interval, and not in anything about the departing
  # node's health.
  endpointRetention: 3m

  # IPv6 prefix for the tunnel addresses of a dual-stack mesh, /96 or
  # shorter: each node's IPv6 tunnel address is its IPv4 tunnel address
  # in the low 32 bits. Used only when the cluster's pod network
  # allocates IPv6 (a Calico IPv6 pool, or IPv6 node pod CIDRs). It must
  # not overlap any site, pod or service range. Empty keeps the mesh
  # IPv4-only even on a dual-stack cluster.
  ipv6Prefix: "fd00:10:100::/96"

# Keep the site's pod network off cloud nodes whose pods a provider-native
# network (the AWS VPC CNI) owns. Site CNI DaemonSets tolerate every taint,
# so each one gets a required node-affinity term excluding those nodes'
# cloud-provisioning.appmana.com/cni values; site nodes, which carry no such
# label, still match. Recognised: DaemonSets mounting /etc/cni/net.d or
# /opt/cni/bin (Calico, Canal, Flannel, Cilium, kube-router, Multus) and
# calico-node-windows; a Tigera operator install is changed through its
# Installation. Adding the term rolls the DaemonSet once.
#
# On a Calico site, tunnel-class cloud nodes (those on the site network over
# their tunnel) do not run the site's calico-node either: it detects each
# node's address, and on a cloud node finds one the site cannot reach. The
# product runs a copy, calico-node-tunnel beside calico-node and kept in step
# with it, on those nodes only, with address detection off (IP=none, and
# IP6=none where the site sets IP6), so Calico keeps the tunnel address the
# product stores. The tunnel carries no BGP, so the full BGP mesh is
# replaced by BGPPeer cloud-provisioning-site-mesh selecting only site nodes
# (nodeToNodeMeshEnabled: false). Peering the site already configured is not
# changed: each BGPPeer must leave cloud nodes out, with
# "!has(cloud-provisioning.appmana.com/role)" as a conjunct of its
# nodeSelector and peerSelector, or name a site node; otherwise tunnel-class
# claims fail naming the peer.
#
# With exclusion false nothing is written, and a cloud machine is created
# only once the site's own configuration already provides all of this.
siteCNI:
  exclusion: true
  # namespace/name of further site network DaemonSets.
  daemonSets: []

# Present this cluster's own control plane to Cluster API, so CAPI can
# manage cloud workers joining a cluster it did not create. Each
# ImportedControlPlane in the release namespace gets a <name>-kubeconfig
# Secret holding a bound, rotated token for serviceAccount.
importedControlPlane:
  enabled: true
  serviceAccount: capi-workload
  # Infrastructure provider managers that read the control-plane contract
  # while reconciling workers, e.g. [{name: capa-controller-manager,
  # namespace: capa-system}]. CAPI core reads it through aggregation.
  providerServiceAccounts: []

# The namespace an infrastructure provider's controller runs in, when
# this controller needs to read a credentials Secret there to check a
# cluster identity before provisioning. Empty grants no such access.
providerManagerNamespace: ""   # e.g. capa-system

# Cluster-level configuration for the docker provider, which fulfills a
# claim as a local container and is how the end to end harness
# exercises the whole path without a cloud account.
provider:
  docker:
    nodeImage: ""
    extraMounts: ""     # host:container, comma-separated
    preloadImages: ""   # comma-separated local image refs

# Reaching a remote's pods from a node that terminates no tunnel.
#
# That node already has the route its CNI installed for the remote's
# pods; what it lacks is a route to the next hop, and it cannot peer
# with the remote to learn one, because the remote's address is its
# tunnel address. A node that does terminate a tunnel therefore
# advertises the remote node addresses with itself as the next hop.
#
# Leave the port at 0 when every node that needs a remote terminates a
# tunnel of its own. Not 179: a node whose CNI speaks BGP is already
# there. Understood by CNIs that speak BGP, which is Calico and
# kube-router.
transit:
  bgpPort: 0        # e.g. 1790
  bgpASN: 64512

# Which cluster technology mints join credentials
# (k0s | kubeadm | k3s | rke2 | microk8s).
joinProvider: k0s

# With joinProvider microk8s, the chart runs a token agent on one MicroK8s
# control plane that mints the cluster agent's join tokens and keeps Secret
# microk8s-provider-config current; each token is replaced at half its
# lifetime and removed once expired. Disable it only to supply that Secret
# yourself (config.json: joinURL, revision, version, expiresAt).
microk8s:
  tokenAgent:
    enabled: true
    tokenTTL: 24h
# Extra kubelet flags for every cloud worker. Its labels and taint come
# from its node class (the machine template's cloud-provisioning.appmana.com/cni
# label, or the platform default) and may not be set here.
joinKubeletExtraFlags: ""

# First-boot binary delivery. A remote node has no image puller before
# it joins, so cloud-init fetches this sha-pinned binary; afterwards
# the DaemonSet image is the upgrade channel. A url is an https:// URL used
# as given, or s3://bucket/key in artifactRegion, which the controller signs
# with aws.credentials each time it renders a bootstrap, valid as long as the
# join token beside it; the credentials need s3:GetObject on the key and
# must outlive the URL. The same applies to cniPlugins.
artifactRegion: ""
dialerBinary:
  arm64:
    url: ""
    sha256: ""
  amd64:
    url: ""
    sha256: ""

# Standard containernetworking plugins for provisioned nodes. A
# cluster's CNI config may chain bandwidth/portmap/tuning; calico-node
# installs only its own and a stock cloud image ships none, so without
# these every pod sandbox on a provisioned node fails. Optional, but a
# URL without its sha256 is ignored rather than fetched unverified.
cniPlugins:
  arm64:
    url: ""
    sha256: ""
  amd64:
    url: ""
    sha256: ""

# Cluster API, available as an optional subchart for a one-release
# install. It is disabled by default, and the recommended production
# layout is a separate HelmRelease for cluster-api-operator: coupling
# the two lifecycles means a failed upgrade of this chart can delete
# the provider namespaces, and with them the provider controllers and
# the credentials Secrets that live there. See the gitops example in
# the README.
cluster-api-operator:
  enabled: false
  # Same Linux-only reasoning as above.
  nodeSelector:
    kubernetes.io/os: linux
  cert-manager:
    enabled: false   # most clusters already run cert-manager
  # Providers the operator installs, as objects keyed by provider name
  # (the subchart's schema requires objects, not strings). Set an
  # infrastructure provider per environment, e.g.:
  #   infrastructure:
  #     aws:
  #       namespace: capa-system
  #       version: v2.13.0
  # AWS additionally needs a credentials Secret the operator references.
  # deployment.nodeSelector is passed straight through to the Provider
  # CR, which is the only way the provider's own controller gets one:
  # the operator renders those Deployments from upstream manifests,
  # which carry no OS selector. Without this a linux-only provider
  # controller lands on a Windows node and ImagePullBackOffs with "no
  # match for platform in manifest".
  core:
    cluster-api:
      namespace: capi-system
      deployment:
        nodeSelector:
          kubernetes.io/os: linux
  infrastructure: {}
  # This project renders its own bootstrap data (the join-pattern
  # cloud-config becomes the Machine's dataSecretName directly), and
  # the target cluster's control plane is externally managed, so
  # neither the kubeadm bootstrap provider nor the kubeadm
  # control-plane provider is needed. If an environment does want
  # them, give each a deployment.nodeSelector too, for the same
  # Windows-node reason.
  bootstrap: {}
  controlPlane: {}

# Opt-in Windows Calico subnet gateway reconciliation. The ConfigMap contains
# scope.json. Empty configMap disables registration.
awsGateway:
  configMap: ""

# Credentials for the controller's own AWS calls (observing the VPC CNI's
# allocations, Windows gateway routes), read through the AWS SDK's standard
# chain. secretName is a Secret in the release namespace holding either AWS_*
# environment keys (mount: env), or the files `config` and `credentials`
# (mount: files), which the SDK reads as AWS_CONFIG_FILE and
# AWS_SHARED_CREDENTIALS_FILE. A profile with role_arn and source_profile has
# the SDK assume that role and refresh it itself. Empty uses whatever the
# pod's environment provides (for example workload identity).
aws:
  credentials:
    secretName: ""
    mount: env

platforms:
  aws:
    # The AWS VPC CNI (aws-node) on AWS nodes whose class runs it. The
    # controller applies it from the pinned upstream chart with the site's
    # facts: it keeps SNAT off traffic to the site's pod, Service and node
    # addresses, gives pods the tunnel's MTU, and uses one ENI per node.
    vpcCNI:
      enabled: true
      # The pod address family the AWS VPC CNI gives pods on AWS nodes.
      family: ipv4
      # Digest-pinned overrides of the pinned upstream images, such as a
      # mirror's; empty uses public.ecr.aws/eks/amazon-k8s-cni(-init) v1.23.2.
      image: ""
      initImage: ""

# Requires manual installation of the experimental group CRD.
experimentalNodeGroups: false

