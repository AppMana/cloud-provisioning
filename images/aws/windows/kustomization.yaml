apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - cni-daemonset.yaml
configMapGenerator:
  - name: aws-vpc-cni-windows-scripts
    files:
      - configure-cni.ps1
      - verify-cni.ps1
      - cni-artifacts.json
  - name: aws-vpc-cni-windows-settings
    literals:
      - 'settings.json={}'
