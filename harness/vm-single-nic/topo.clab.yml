name: wgdialer-vm-single-nic
mgmt:
  network: wgdialer-vm-mgmt
  ipv4-subnet: 172.31.41.0/24

topology:
  nodes:
    # onprem: the real k0s + DaemonSet-managed dialer, exactly like
    # the on-prem host. Reboot-based RED/GREEN scenarios run against this node.
    onprem:
      kind: linux
      image: vrnetlab/canonical_ubuntu:jammy
      # Pinned: containerlab otherwise assigns mgmt IPs by deploy
      # order, which is not stable across runs, and k0sctl.yaml plus
      # the driver script address nodes by these exact IPs.
      mgmt-ipv4: 172.31.41.2
      binds:
        - cfg/onprem-setup.sh:/extra-setup.sh:ro
      env:
        # launch.py hardcodes ram=512 (fine for a bare network-device VM,
        # not for a real k0s controller+worker: etcd, kube-apiserver and
        # kubelet all in one process need real headroom).
        QEMU_MEMORY: "4096"
        QEMU_SMP: "2"
        # CLAB_MGMT_PASSTHROUGH was tried and reverted: this Ubuntu image's
        # launch.py always writes a hardcoded static 10.0.0.15/24 guest
        # network config regardless of passthrough mode, so passthrough's
        # "guest uses the container's own IP" assumption doesn't actually
        # hold here, and SSH breaks entirely. Staying on the default
        # host-forwarded (qemu usermode NAT) mode instead, with 6443/UDP
        # 51820 added to the forwarded port list directly in the shared
        # vrnetlab fork (~/Documents/vrnetlab/ubuntu/docker/launch.py).
      # No `links:` entries for this node on purpose: the mgmt NIC
      # (Docker-bridge-NATed, real internet egress) is its only interface,
      # matching the on-prem host's single real uplink. wg0 is created inside the
      # guest by the dialer itself and dials out over this same NIC, so
      # there is no second interface for it to avoid conflicting with.
      # The hijack this harness reproduces is a route on the same link
      # the real default route already uses, not a second link.

    # cloud: the wg-quick replacement, the dialer binary as a bare
    # systemd unit, listener role, no k0s at all (it isn't a Kubernetes
    # node in the real topology either; see
    # join-patterns/k0s-worker.cloud-config.tmpl). Same single-NIC
    # invariant as onprem: no `links:` entry, mgmt NIC only.
    cloud:
      kind: linux
      image: vrnetlab/canonical_ubuntu:jammy
      mgmt-ipv4: 172.31.41.3
      binds:
        - cfg/cloud-setup.sh:/extra-setup.sh:ro
      env:
        QEMU_MEMORY: "2048"
        QEMU_SMP: "1"

  # No explicit link between onprem and cloud: both sit on the one
  # shared containerlab mgmt bridge (172.31.41.0/24), which is the
  # internet-path stand-in here, with two independently-NATed endpoints
  # (each behind its own qemu slirp NAT) reaching each other over some
  # path rather than a LAN shortcut. This is a documented
  # simplification: only the ports forwarded into each guest (22/tcp,
  # 6443/tcp, 51820/udp; see the shared vrnetlab fork) are reachable at
  # all, which is the invariant that matters, since only WireGuard's
  # own port needs to be reachable between the two real nodes. The
  # specific shape of the path between them does not matter.
