# The site, two clouds, and the wan between them.
#
# Four separate L2 segments, not one bridge with routes pretending.
#
#   cldt-lan      the site: control plane and workers, private
#   cldt-wan      the transit segment, standing in for the internet
#   cldt-cloud-a  one cloud, one remote node with a public address
#   cldt-cloud-b  another cloud, another remote
#
# The three routers meet on the wan. The site's router masquerades what
# leaves and forwards nothing in, so the site can open a connection
# outward and nothing can open one to it. The cloud edges forward both
# ways, because a node with a public address is reachable, which is the
# whole reason a remote is put where it is.
#
# Two remotes sharing one bridge would be neighbours on a broadcast
# domain, which is not two clouds. Here they reach each other across the
# wan or not at all, so whether the mesh forms directly between them is
# a question this topology can answer rather than one it presupposes.
#
# The kind harness put every node on a single bridge and simulated the
# distance with host routes and masquerading. Simulating it meant it
# could be bypassed, and it was: the remote had to reach the API server
# directly while it booted, so the control plane was excluded from the
# masquerade, and that exception produced most of the failures worth
# chasing.
#
# Every node also has containerlab's management interface, which is how
# the harness drives the test and nothing else. Kubelet is pinned to the
# segment address and the tunnel is built on segment addresses, so no
# part of the product sees it, and the assertions are written against
# segment addresses only.
name: cldt

topology:
  kinds:
    linux:
      image: kindest/node:v1.34.0
      # No management network. containerlab attaches every node to one by
      # default, which joins the site and both clouds on a single L2: a
      # remote then reaches the control plane whatever the routers say,
      # and the isolation this topology exists to model is not real. It
      # also hands each node a second address to register, which a real
      # instance does not have, so kubelet chose the wrong one.
      #
      # A node here has the interfaces its segments give it and nothing
      # else. The harness drives them with docker exec, which needs no
      # address at all.
      network-mode: none

  nodes:
    cldt-lan:
      kind: bridge
    cldt-wan:
      kind: bridge
    cldt-cloud-a:
      kind: bridge
    cldt-cloud-b:
      kind: bridge

    # The site's edge. Anything may leave; nothing may arrive.
    router:
      kind: linux
    # Each cloud's edge. A public address is reachable, both ways.
    edge-a:
      kind: linux
    edge-b:
      kind: linux

    # How the site is reached and provisioned, and the only thing that
    # reaches it. An operator's jump host on the office network: it
    # holds the kubeconfig, runs kubectl, and once the nodes are VMs it
    # is what carries a serial or ssh session to a machine whose single
    # NIC is on a network nothing outside can address. Modelling it is
    # closer to how the site gets built than reaching in from the host.
    bastion:
      kind: linux

    # The cluster, all of it, at the site. Three control planes,
    # because two is worse than one: stacked etcd needs a majority, and
    # a majority of two is two, so either death halts the cluster. With
    # three, any single node may die and the cluster keeps its quorum,
    # which is what the outage rows exist to prove.
    cp:
      kind: linux
      binds:
        - var/cp:/var/lib/containerd
        - var-k0s/cp:/var/lib/k0s
        - var-rancher/cp:/var/lib/rancher
    cp2:
      kind: linux
      binds:
        - var/cp2:/var/lib/containerd
        - var-k0s/cp2:/var/lib/k0s
        - var-rancher/cp2:/var/lib/rancher
    cp3:
      kind: linux
      binds:
        - var/cp3:/var/lib/containerd
        - var-k0s/cp3:/var/lib/k0s
        - var-rancher/cp3:/var/lib/rancher
    w1:
      kind: linux
      binds:
        - var/w1:/var/lib/containerd
        - var-k0s/w1:/var/lib/k0s
        - var-rancher/w1:/var/lib/rancher
    w2:
      kind: linux
      binds:
        - var/w2:/var/lib/containerd
        - var-k0s/w2:/var/lib/k0s
        - var-rancher/w2:/var/lib/rancher

    # One node in each cloud, so that they are in different clouds.
    remote1:
      kind: linux
      binds:
        - var/remote1:/var/lib/containerd
        - var-k0s/remote1:/var/lib/k0s
        - var-rancher/remote1:/var/lib/rancher
    remote2:
      kind: linux
      binds:
        - var/remote2:/var/lib/containerd
        - var-k0s/remote2:/var/lib/k0s
        - var-rancher/remote2:/var/lib/rancher

  links:
    # the site
    - endpoints: ["router:eth1", "cldt-lan:lan-router"]
    - endpoints: ["bastion:eth1", "cldt-lan:lan-bastion"]
    - endpoints: ["cp:eth1", "cldt-lan:lan-cp"]
    - endpoints: ["cp2:eth1", "cldt-lan:lan-cp2"]
    - endpoints: ["cp3:eth1", "cldt-lan:lan-cp3"]
    - endpoints: ["w1:eth1", "cldt-lan:lan-w1"]
    - endpoints: ["w2:eth1", "cldt-lan:lan-w2"]

    # the wan, where the three edges meet
    - endpoints: ["router:eth2", "cldt-wan:wan-router"]
    - endpoints: ["edge-a:eth2", "cldt-wan:wan-edge-a"]
    - endpoints: ["edge-b:eth2", "cldt-wan:wan-edge-b"]

    # each cloud behind its own edge
    - endpoints: ["edge-a:eth1", "cldt-cloud-a:a-edge"]
    - endpoints: ["remote1:eth1", "cldt-cloud-a:a-remote1"]
    - endpoints: ["edge-b:eth1", "cldt-cloud-b:b-edge"]
    - endpoints: ["remote2:eth1", "cldt-cloud-b:b-remote2"]
