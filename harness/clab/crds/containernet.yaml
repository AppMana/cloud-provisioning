# The kinds a claim needs when the machine is a container the lab owns.
#
# These are deliberately permissive. A real infrastructure provider
# publishes a schema because its own controller has to act on the spec;
# nothing acts on these but the harness, which reads one annotation and
# writes status. Constraining fields here would only make the harness
# fight the API server over shapes nobody validates.
#
# The cluster carries a status subresource because a claim whose Cluster
# is marked managed-by external has its infrastructure status patched by
# this operator rather than by Cluster API.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containernetclusters.containernet.appmana.com
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ContainernetCluster
    listKind: ContainernetClusterList
    plural: containernetclusters
    singular: containernetcluster
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containernetmachines.containernet.appmana.com
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ContainernetMachine
    listKind: ContainernetMachineList
    plural: containernetmachines
    singular: containernetmachine
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        # The container this machine stands for, which is the whole
        # point of the kind: the object is named by the claim and the
        # container by whoever created it, and they rarely agree.
        - name: Container
          type: string
          jsonPath: .metadata.annotations.containernet\.appmana\.com/container-name
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containernetmachinetemplates.containernet.appmana.com
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ContainernetMachineTemplate
    listKind: ContainernetMachineTemplateList
    plural: containernetmachinetemplates
    singular: containernetmachinetemplate
  versions:
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
