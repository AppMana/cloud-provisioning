apiVersion: v1
kind: Namespace
metadata:
  name: wg-dialer
---
# The wg-dialer-peer Secret carries the cloud peer's entries (created
# per run by scripts/run-scenario.sh, where the driver plays the join
# reconciler's role of generating the cloud side's key) plus the
# on-prem node's controller-side allocations. The on-prem dialer's own
# key is not in it: the dialer generates it node-locally and
# publishes only the public key, hence "patch" rather than just "get".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wg-dialer-read-secret
  namespace: wg-dialer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wg-dialer-read-secret
  namespace: wg-dialer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: wg-dialer
roleRef:
  kind: Role
  name: wg-dialer-read-secret
  apiGroup: rbac.authorization.k8s.io
