                      - id
                      - vlanID
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  deviceIndex:
                    description: DeviceIndex is the attachment device index of the
                      trunk ENI on the instance.
                    format: int32
                    type: integer
                  id:
                    description: ID is the EC2 network interface id of the trunk ENI.
                    minLength: 1
                    type: string
                  macAddress:
                    description: MacAddress is the MAC address of the trunk ENI.
                    type: string
                  subnetID:
                    description: |-
                      SubnetID is the id of the EC2 subnet the trunk ENI resides in, which is
                      also the subnet its branch ENIs are created in. Persisted with the trunk
                      so a controller can create a branch ENI straight from the CNINode,
                      without a DescribeNetworkInterfaces call on the pod path, and so the
                      value survives a controller restart that drops in-memory node state.
                    maxLength: 24
                    pattern: ^subnet-([0-9a-f]{8}|[0-9a-f]{17})$
                    type: string
                required:
                - id
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.managedBy
    served: true
    storage: true
    subresources:
      status: {}
