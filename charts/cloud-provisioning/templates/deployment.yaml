{{- /* Every arg is quoted: an IPv6 prefix value ends in ":", and an
unquoted YAML list item ending in a colon parses as a mapping key with
a null value, which injects a {} into the container args and makes the
Deployment patch invalid. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-provisioning.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloud-provisioning.controllerName" . }}
  template:
    metadata:
      labels:
        app: {{ include "cloud-provisioning.controllerName" . }}
        {{- include "cloud-provisioning.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cloud-provisioning.controllerName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cloud-provisioning.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- /* Every name the controller creates or looks up at
            runtime is stated here, so it matches what this chart
            actually created rather than whatever the binary happens to
            default to. */}}
            - "--secret-namespace={{ .Release.Namespace }}"
            - "--secret-name={{ include "cloud-provisioning.name" . }}-peers"
            - "--dialer-service-account={{ include "cloud-provisioning.name" . }}"
            - "--dialer-daemonset-name={{ include "cloud-provisioning.name" . }}-dialer"
            - "--dialer-cloud-daemonset-name={{ include "cloud-provisioning.name" . }}-dialer-remote"
            - "--aws-config-namespace={{ .Release.Namespace }}"
            {{- with .Values.transit.bgpPort }}
            - "--transit-bgp-port={{ . }}"
            - "--transit-bgp-asn={{ $.Values.transit.bgpASN }}"
            {{- end }}
            - "--owner-deployment={{ include "cloud-provisioning.controllerName" . }}"
            - "--dialer-image={{ include "cloud-provisioning.dialerImage" . }}"
            - "--join-provider={{ .Values.joinProvider }}"
            - "--join-template-path=/join-patterns/{{ .Values.joinProvider }}-worker.cloud-config.tmpl"
            {{- with .Values.cluster.apiAddress }}
            - "--join-api-address={{ . }}"
            {{- end }}
            {{- with .Values.tunnel.endpoints }}
            - "--tunnel-endpoints={{ . }}"
            {{- end }}
            {{- with .Values.dialerBinary.arm64.url }}
            - "--join-dialer-binary-url-arm64={{ . }}"
            - "--join-dialer-binary-sha256-arm64={{ $.Values.dialerBinary.arm64.sha256 | required "dialerBinary.arm64.sha256 is required when a url is set: an unpinned download is a supply-chain hole" }}"
            {{- end }}
            {{- with .Values.imagePullSecrets }}
            - "--dialer-image-pull-secret={{ (first .).name }}"
            {{- end }}
            {{- with .Values.dialerCloud.image }}
            - "--dialer-cloud-image={{ . }}"
            - "--dialer-cloud-host-binary={{ $.Values.dialerCloud.hostBinary }}"
            {{- end }}
            {{- with .Values.cniPlugins.arm64.url }}
            - "--join-cni-plugins-url-arm64={{ . }}"
            - "--join-cni-plugins-sha256-arm64={{ $.Values.cniPlugins.arm64.sha256 | required "cniPlugins.arm64.sha256 is required when a url is set" }}"
            {{- end }}
            {{- with .Values.cniPlugins.amd64.url }}
            - "--join-cni-plugins-url-amd64={{ . }}"
            - "--join-cni-plugins-sha256-amd64={{ $.Values.cniPlugins.amd64.sha256 | required "cniPlugins.amd64.sha256 is required when a url is set" }}"
            {{- end }}
            {{- with .Values.dialerBinary.amd64.url }}
            - "--join-dialer-binary-url-amd64={{ . }}"
            - "--join-dialer-binary-sha256-amd64={{ $.Values.dialerBinary.amd64.sha256 | required "dialerBinary.amd64.sha256 is required when a url is set: an unpinned download is a supply-chain hole" }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
