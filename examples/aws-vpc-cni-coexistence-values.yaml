# AWS VPC CNI Helm chart v1.22.2. One primary CNI per node; no Multus.
# Label AWS nodes at registration, before any workload CNI installer schedules.
nodeSelector:
  kubernetes.io/os: linux
  cloud-provisioning.appmana.com/cni: aws-vpc
# NetworkPolicy enforcement is a separate deployment choice.
enableNetworkPolicy: "false"
nodeAgent:
  enabled: false
env:
  AWS_VPC_K8S_CNI_CUSTOM_NETWORK_CFG: "false"
  AWS_VPC_K8S_CNI_EXTERNALSNAT: "false"
  # Replace with the real site pod and node CIDRs. Preserve pod sources to site.
  AWS_VPC_K8S_CNI_EXCLUDE_SNAT_CIDRS: "10.244.0.0/16,10.10.0.0/24"
  AWS_VPC_ENI_MTU: "1500"
  POD_MTU: "1370"
  # This test profile keeps one ENI and a small secondary-address warm pool.
  MAX_ENI: "1"
  WARM_ENI_TARGET: "0"
  WARM_IP_TARGET: "1"
  MINIMUM_IP_TARGET: "2"
  ENABLE_PREFIX_DELEGATION: "false"
