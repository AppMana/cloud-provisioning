{{- /* The CAPI Cluster pair this release's Machines hang off. Cluster
API does not manage this control plane -- the objects are annotated
managed-by: external and exist only as an anchor -- but Machines block
forever without them. Rendering them here is what makes an install
reproducible from the chart alone; created by hand, they are a step
the next operator has to rediscover. Their status is reported by the
controller, not patched by hand. */}}
{{- with .Values.targetCluster }}
{{- if .enabled }}
{{- $ns := .namespace | default $.Release.Namespace }}
{{- $kind := .infrastructureKind }}
{{- if eq $kind "AWSCluster" }}
{{- $aws := $.Values.provider.aws }}
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSClusterStaticIdentity
metadata:
  name: {{ .name }}
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
spec:
  # Credentials are referenced, never carried: these values go into
  # git, so the Secret is created out of band and only named here.
  secretRef: {{ required "provider.aws.credentialsSecret is required" $aws.credentialsSecret }}
  allowedNamespaces: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    # Also on the INFRA cluster, not just the Cluster: without it the
    # provider treats this as a control plane it manages and fails
    # every machine on a control-plane load balancer that does not
    # exist ("APIServer ELB not available").
    cluster.x-k8s.io/managed-by: external
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
spec:
  region: {{ required "provider.aws.region is required" $aws.region }}
  identityRef:
    kind: AWSClusterStaticIdentity
    name: {{ .name }}
  controlPlaneEndpoint:
    host: {{ include "cloud-provisioning.apiHost" $ | quote }}
    port: {{ include "cloud-provisioning.apiPort" $ }}
  network:
    subnets:
      - id: {{ required "provider.aws.subnetID is required" $aws.subnetID }}
        isPublic: true
---
{{- else }}
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: {{ $kind }}
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    cluster.x-k8s.io/managed-by: external
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
spec:
  controlPlaneEndpoint:
    host: {{ include "cloud-provisioning.apiHost" $ | quote }}
    port: {{ include "cloud-provisioning.apiPort" $ }}
---
{{- end }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    cluster.x-k8s.io/managed-by: external
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
spec:
  controlPlaneEndpoint:
    host: {{ include "cloud-provisioning.apiHost" $ | quote }}
    port: {{ include "cloud-provisioning.apiPort" $ }}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: {{ $kind }}
    name: {{ .name }}
{{- end }}
{{- end }}
