# Lab platform resources consumed by the product and real CAPI controllers.
# The lab provider owns VM lifecycle and reports infrastructure observations.
# ImportedControlPlane observes the existing site's API; CAPI itself writes
# Cluster initialization and Machine Node associations.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containernetclusters.containernet.appmana.com
  # Cluster API reads this to learn which of a provider's API
  # versions satisfies which of its contracts. Without it, its
  # conversion webhook cannot resolve the kind at all and every
  # Cluster stays Provisioning while every Machine stays Pending,
  # with the reason only in Cluster API's own log:
  # "cannot find any versions matching contract versions".
  #
  # A provider that is never run against Cluster API can omit this and
  # look correct, which is exactly what happened here.
  labels:
    cluster.x-k8s.io/v1beta1: v1beta2
    cluster.x-k8s.io/v1beta2: v1beta2
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ContainernetCluster
    listKind: ContainernetClusterList
    plural: containernetclusters
    singular: containernetcluster
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containernetmachines.containernet.appmana.com
  # Cluster API reads this to learn which of a provider's API
  # versions satisfies which of its contracts. Without it, its
  # conversion webhook cannot resolve the kind at all and every
  # Cluster stays Provisioning while every Machine stays Pending,
  # with the reason only in Cluster API's own log:
  # "cannot find any versions matching contract versions".
  #
  # A provider that is never run against Cluster API can omit this and
  # look correct, which is exactly what happened here.
  labels:
    cluster.x-k8s.io/v1beta1: v1beta2
    cluster.x-k8s.io/v1beta2: v1beta2
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ContainernetMachine
    listKind: ContainernetMachineList
    plural: containernetmachines
    singular: containernetmachine
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        # The container this machine stands for, which is the whole
        # point of the kind: the object is named by the claim and the
        # container by whoever created it, and they rarely agree.
        - name: Container
          type: string
          jsonPath: .metadata.annotations.containernet\.appmana\.com/container-name
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
