---
# Cluster API's manager reads and writes a provider's own kinds, and
# its ClusterRole is an aggregate: a provider grants those permissions
# by shipping a role labelled to aggregate into it. Without this the
# manager lists nothing and every Cluster and Machine stays in an
# empty phase, with the reason only in Cluster API's own log
# ("is forbidden: User ... cannot list resource").
#
# A provider that is never run against Cluster API can omit this and
# look entirely correct, which is what happened here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: importedcontrolplanes.containernet.appmana.com
  labels:
    cluster.x-k8s.io/v1beta2: v1beta2
spec:
  group: containernet.appmana.com
  scope: Namespaced
  names:
    kind: ImportedControlPlane
    listKind: ImportedControlPlaneList
    plural: importedcontrolplanes
    singular: importedcontrolplane
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-aggregate-containernet
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
  - apiGroups: ["containernet.appmana.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
