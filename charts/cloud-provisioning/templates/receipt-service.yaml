{{- $receipts := dig "journal" "receipts" (dict) .Values.tunnel.receivePreparation }}
{{- if $receipts }}
{{- $port := last (splitList ":" $receipts.bindAddress) | int }}
{{- if or (lt $port 1) (gt $port 65535) }}
{{- fail "Receipt service requires an explicit numeric serving port" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-receipts
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ include "cloud-provisioning.controllerName" . }}
  ports:
    - name: https-receipts
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
{{- if not .Values.tunnel.receiptTLSSecret }}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- fail "Receipt serving needs tunnel.receiptTLSSecret, or cert-manager to issue one" }}
{{- end }}
{{- $name := include "cloud-provisioning.controllerName" . }}
{{- /* A self-signed root signs a long-lived CA; the CA issues the serving
certificate, which cert-manager renews well inside the CA's lifetime, so the
CA agents trust does not change when the serving certificate does. */}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-receipts-root
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-receipts-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ $name }} receipt CA
  secretName: {{ $name }}-receipts-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $name }}-receipts-root
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-receipts-ca
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ $name }}-receipts-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-receipts-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ $name }}-receipts-tls
  dnsNames:
    - {{ $name }}-receipts.{{ .Release.Namespace }}.svc
  usages: ["server auth", "digital signature", "key encipherment"]
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $name }}-receipts-ca
    kind: Issuer
{{- end }}
{{- end }}
