{{- /* The infrastructure provider's cluster-level configuration. Not
credentials -- AMI ids, subnet, security groups: plain configuration
that belongs in values with everything else, rather than an
out-of-band `kubectl create secret` the next operator has to know
about. The credentials Secret is referenced by name (see the
AWSClusterStaticIdentity), never rendered from values. */}}
{{- with .Values.provider.aws }}
{{- if or .region .subnetID .ami.amd64 .ami.arm64 }}
apiVersion: v1
kind: Secret
metadata:
  name: aws-provider-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
type: Opaque
stringData:
  public-ip: {{ .publicIP | quote }}
  {{- with .ami.amd64 }}
  ami-amd64: {{ . | quote }}
  {{- end }}
  {{- with .ami.arm64 }}
  ami-arm64: {{ . | quote }}
  {{- end }}
  {{- with .subnetID }}
  subnet-id: {{ . | quote }}
  {{- end }}
  {{- with .securityGroupIDs }}
  security-group-ids: {{ . | quote }}
  {{- end }}
  {{- with .sshKeyName }}
  ssh-key-name: {{ . | quote }}
  {{- end }}
  {{- with .iamInstanceProfile }}
  iam-instance-profile: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .Values.provider.docker }}
{{- if .nodeImage }}
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-provider-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cloud-provisioning.labels" $ | nindent 4 }}
type: Opaque
stringData:
  node-image: {{ .nodeImage | quote }}
  {{- with .extraMounts }}
  extra-mounts: {{ . | quote }}
  {{- end }}
  {{- with .preloadImages }}
  preload-images: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
