# The single resource a user commits to get a public cloud worker
# joined over a WireGuard tunnel. Everything else (the CAPI Machine and
# AWSMachine pair, the tunnel-bootstrapping userdata, the tunnel
# address allocations, both dialer DaemonSets, the adoption config) is
# derived by the controller. Deleting this claim cascades: the instance
# terminates, the Secrets are garbage-collected.
#
# The spec names no cloud. Which cloud fulfills it is decided by the
# registered provider owning the CAPI Cluster's infrastructure (see
# ../cluster/externally-managed-cluster.yaml); the requests resolve to
# that provider's smallest satisfying instance type (here: t4g.medium).
apiVersion: cloud-provisioning.appmana.com/v1alpha1
kind: ProvisionedNodeClaim
metadata:
  name: public-worker
  namespace: default
spec:
  requests:
    cpu: "2"
    memory: 4Gi
  arch: arm64
  internetFacing: true
  # Optional: restrict which local nodes terminate tunnels to this
  # node (default: every Linux worker; control planes are always
  # excluded unless named explicitly). A single-node rehearsal is just
  # a hostname selector:
  # tunnelEndpoints:
  #   matchLabels:
  #     kubernetes.io/hostname: <node>
---
# The AWS provider's cluster-level configuration, the only AWS-specific
# input, supplied once as a plain Secret (SealedSecrets or SOPS is the
# repo owner's choice, not required). Keys the provider
# reads: ami-arm64/ami-amd64, ssh-key-name, security-group-ids,
# subnet-id, iam-instance-profile, public-ip,
# insecure-skip-secrets-manager.
apiVersion: v1
kind: Secret
metadata:
  name: aws-provider-config
  namespace: wg-dialer
stringData:
  ami-arm64: <arm64-ubuntu-ami-id>
  ssh-key-name: <keypair-name>
  # additionalSecurityGroups, not securityGroupOverrides, is what the
  # rendered AWSMachine carries. In CAPA's GetCoreSecurityGroups
  # (pkg/cloud/services/ec2/instances.go), for an
  # externally-managed Machine it ignores securityGroupOverrides
  # entirely. The wrong field leaves the instance on the VPC default SG
  # and CAPA tight-loops trying to reconcile the ENI to zero groups.
  security-group-ids: <sg-id-allowing-80-443-udp51820>
  subnet-id: <public-subnet-id>
