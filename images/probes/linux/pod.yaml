apiVersion: v1
kind: Namespace
metadata:
  name: cldt-gpu-probe
---
apiVersion: v1
kind: Pod
metadata:
  name: linux-render-encode
  namespace: cldt-gpu-probe
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: REPLACE_WITH_GPU_NODE
    kubernetes.io/os: linux
  tolerations:
    - key: cloud-provisioning.appmana.com/internet-facing
      operator: Exists
      effect: NoSchedule
  containers:
    - name: probe
      image: REPLACE_WITH_PROBE_IMAGE_AT_DIGEST
      imagePullPolicy: IfNotPresent
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,video,utility
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: 1Gi
        requests:
          cpu: "1"
