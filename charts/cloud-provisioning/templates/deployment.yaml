{{- if and .Values.windowsBootstrap.nativePodRouting (not .Values.windowsBootstrap.tunnelSHA256) }}
{{- fail "Windows native pod routing requires a pinned tunnel executable" }}
{{- end }}
{{- if and .Values.awsPodObserver.credentialsSecret .Values.awsPodObserver.credentialsFileSecret }}
{{- fail "Choose either AWS observer environment credentials or rotating file credentials" }}
{{- end }}
{{- if and .Values.awsPodObserver.credentialsFileSecret (not .Values.awsPodObserver.configMap) }}
{{- fail "Rotating AWS observer credentials require awsPodObserver.configMap" }}
{{- end }}
{{- /* Every arg is quoted: an IPv6 prefix value ends in ":", and an
unquoted YAML list item ending in a colon parses as a mapping key with
a null value, which injects a {} into the container args and makes the
Deployment patch invalid. */ -}}
{{- if and .Values.awsGateway.configMap .Values.awsPodObserver.configMap }}
{{- fail "AWS pod observer and Windows gateway require separate qualified deployments" }}
{{- end }}
{{- $receivePolicy := deepCopy .Values.tunnel.receivePreparation }}
{{- $receipts := dig "journal" "receipts" (dict) $receivePolicy }}
{{- if $receipts }}
{{- $_ := required "Receipt serving requires tunnel.receiptTLSSecret" .Values.tunnel.receiptTLSSecret }}
{{- $_ := set $receipts "trustSecret" .Values.tunnel.receiptTLSSecret }}
{{- $_ := set $receipts "endpoint" (printf "https://%s-receipts.%s.svc:%s/v1/receipts" (include "cloud-provisioning.controllerName" .) .Release.Namespace (last (splitList ":" $receipts.bindAddress))) }}
{{- if or (ne $receipts.certFile "/etc/cloud-provisioning/receipts/tls.crt") (ne $receipts.keyFile "/etc/cloud-provisioning/receipts/tls.key") }}
{{- fail "Receipt TLS files must use the mounted /etc/cloud-provisioning/receipts directory" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-provisioning.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Keep upgrades simple while mesh-scoped leader election also protects
  # against overlapping controller processes or releases.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ include "cloud-provisioning.controllerName" . }}
  template:
    metadata:
      labels:
        app: {{ include "cloud-provisioning.controllerName" . }}
        {{- include "cloud-provisioning.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cloud-provisioning.controllerName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.awsPodObserver.credentialsFileSecret }}
      securityContext:
        fsGroup: 65532
      {{- end }}
      {{- if or .Values.awsGateway.configMap .Values.awsPodObserver.configMap $receipts }}
      volumes:
        {{- if $receipts }}
        - name: receipt-tls
          secret:
            secretName: {{ .Values.tunnel.receiptTLSSecret | quote }}
        {{- end }}
        {{- with .Values.awsPodObserver.configMap }}
        - name: aws-pod-scope
          configMap:
            name: {{ . | quote }}
        {{- end }}
        {{- with .Values.awsPodObserver.credentialsFileSecret }}
        - name: aws-pod-credentials
          secret:
            secretName: {{ . | quote }}
            defaultMode: 0440
            items:
              - key: credentials.json
                path: credentials.json
        {{- end }}
        {{- with .Values.awsGateway.configMap }}
        - name: aws-gateway-scope
          configMap:
            name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cloud-provisioning.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.awsGateway.configMap .Values.awsPodObserver.configMap $receipts }}
          volumeMounts:
            {{- if $receipts }}
            - name: receipt-tls
              mountPath: /etc/cloud-provisioning/receipts
              readOnly: true
            {{- end }}
            {{- if .Values.awsGateway.configMap }}
            - name: aws-gateway-scope
              mountPath: /etc/cloud-provisioning/gateway
              readOnly: true
            {{- end }}
            {{- if .Values.awsPodObserver.configMap }}
            - name: aws-pod-scope
              mountPath: /etc/cloud-provisioning/aws-pods
              readOnly: true
            {{- with .Values.awsPodObserver.credentialsFileSecret }}
            - name: aws-pod-credentials
              mountPath: /etc/cloud-provisioning/aws-credentials
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.awsGateway.configMap }}
          {{- with .Values.awsGateway.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.awsPodObserver.configMap }}
          {{- with .Values.awsPodObserver.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          {{- end }}
          args:
            {{- if .Values.awsPodObserver.configMap }}
            - "--aws-pod-config=/etc/cloud-provisioning/aws-pods/scope.json"
            {{- if .Values.awsPodObserver.credentialsFileSecret }}
            - "--aws-pod-credentials-file=/etc/cloud-provisioning/aws-credentials/credentials.json"
            {{- end }}
            {{- end }}
            {{- if .Values.experimentalNodeGroups }}
            - "--experimental-node-groups=true"
            {{- end }}
            {{- if .Values.awsGateway.configMap }}
            - "--aws-gateway-config=/etc/cloud-provisioning/gateway/scope.json"
            {{- end }}
            {{- /* Every name the controller creates or looks up at
            runtime is stated here, so it matches what this chart
            actually created rather than whatever the binary happens to
            default to. */}}
            - "--secret-namespace={{ .Release.Namespace }}"
            - "--secret-name={{ include "cloud-provisioning.name" . }}-peers"
            - "--dialer-service-account={{ include "cloud-provisioning.name" . }}"
            - "--dialer-daemonset-name={{ include "cloud-provisioning.name" . }}-dialer"
            - "--dialer-cloud-daemonset-name={{ include "cloud-provisioning.name" . }}-dialer-remote"
            - "--aws-config-namespace={{ .Release.Namespace }}"
            {{- with .Values.transit.bgpPort }}
            - "--transit-bgp-port={{ . }}"
            - "--transit-bgp-asn={{ $.Values.transit.bgpASN }}"
            {{- end }}
            - "--owner-deployment={{ include "cloud-provisioning.controllerName" . }}"
            - "--dialer-image={{ include "cloud-provisioning.dialerImage" . }}"
            - "--dialer-image-pull-policy={{ .Values.dialerImage.pullPolicy }}"
            - "--join-provider={{ .Values.joinProvider }}"
            {{- with .Values.siteDialer.nodeSelector }}
            {{- $selectors := list }}
            {{- range $key, $value := . }}
            {{- $selectors = append $selectors (printf "%s=%s" $key (toString $value)) }}
            {{- end }}
            - {{ printf "--site-dialer-node-selector=%s" (join "," $selectors) | quote }}
            {{- end }}
            {{- if .Values.joinKubeletExtraArgs }}
            - {{ printf "--join-kubelet-extra-args=%s" .Values.joinKubeletExtraArgs | quote }}
            {{- else if .Values.awsPodObserver.configMap }}
            - "--join-kubelet-extra-args=--node-labels=cloud-provisioning.appmana.com/role=cloud-worker,cloud-provisioning.appmana.com/cni=aws-vpc --register-with-taints=cloud-provisioning.appmana.com/internet-facing:NoSchedule"
            {{- end }}
            - "--join-template-path=/join-patterns/{{ .Values.joinProvider }}-worker.cloud-config.tmpl"
            {{- with .Values.cluster.apiAddress }}
            - "--join-api-address={{ . }}"
            {{- end }}
            {{- with .Values.tunnel.endpoints }}
            - "--tunnel-endpoints={{ . }}"
            {{- end }}
            {{- with .Values.tunnel.endpointRetention }}
            - "--tunnel-endpoint-retention={{ . }}"
            {{- end }}
            - "--tunnel-ipv6-prefix={{ .Values.tunnel.ipv6Prefix }}"
            {{- with $receivePolicy }}
            - {{ printf "--receive-preparation-policy=%s" (toJson .) | quote }}
            {{- end }}
            {{- with .Values.dialerBinary.arm64.url }}
            - "--join-dialer-binary-url-arm64={{ . }}"
            - "--join-dialer-binary-sha256-arm64={{ $.Values.dialerBinary.arm64.sha256 | required "dialerBinary.arm64.sha256 is required when a url is set: an unpinned download is a supply-chain hole" }}"
            {{- end }}
            {{- with .Values.imagePullSecrets }}
            - "--dialer-image-pull-secret={{ (first .).name }}"
            {{- end }}
            {{- if .Values.windowsBootstrap.nativePodRouting }}
            - "--windows-native-pod-routing=true"
            {{- end }}
            {{- with .Values.windowsBootstrap.tunnelSHA256 }}
            - {{ printf "--windows-tunnel-sha256=%s" . | quote }}
            {{- end }}
            {{- with .Values.windowsBootstrap.workerVersion }}
            - {{ printf "--windows-worker-version=%s" . | quote }}
            {{- end }}
            {{- with .Values.windowsBootstrap.workerSHA256 }}
            - {{ printf "--windows-worker-sha256=%s" . | quote }}
            {{- end }}
            {{- with .Values.windowsPublisher.apiServer }}
            - {{ printf "--windows-publisher-api-server=%s" . | quote }}
            {{- end }}
            {{- with .Values.windowsPublisher.image }}
            - {{ printf "--windows-publisher-image=%s" . | quote }}
            {{- end }}
            {{- with .Values.dialerCloud.image }}
            - "--dialer-cloud-image={{ . }}"
            - "--dialer-cloud-host-binary={{ $.Values.dialerCloud.hostBinary }}"
            {{- end }}
            {{- with .Values.cniPlugins.arm64.url }}
            - "--join-cni-plugins-url-arm64={{ . }}"
            - "--join-cni-plugins-sha256-arm64={{ $.Values.cniPlugins.arm64.sha256 | required "cniPlugins.arm64.sha256 is required when a url is set" }}"
            {{- end }}
            {{- with .Values.cniPlugins.amd64.url }}
            - "--join-cni-plugins-url-amd64={{ . }}"
            - "--join-cni-plugins-sha256-amd64={{ $.Values.cniPlugins.amd64.sha256 | required "cniPlugins.amd64.sha256 is required when a url is set" }}"
            {{- end }}
            {{- with .Values.dialerBinary.amd64.url }}
            - "--join-dialer-binary-url-amd64={{ . }}"
            - "--join-dialer-binary-sha256-amd64={{ $.Values.dialerBinary.amd64.sha256 | required "dialerBinary.amd64.sha256 is required when a url is set: an unpinned download is a supply-chain hole" }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
