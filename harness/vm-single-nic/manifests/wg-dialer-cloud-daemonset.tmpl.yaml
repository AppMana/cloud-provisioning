# Mirrors endpoint-controller/main.go's ensureCloudDialerDaemonSet: the
# same dialer binary, scheduled onto the cloud-worker node only (via
# nodeSelector plus a toleration for the cloud-worker taint, the
# inverse of wg-dialer-daemonset.tmpl.yaml's scheduling). Identity
# comes from /etc/wg-dialer/peers.json (hostPath, read-only), and the
# adoption override points at the per-machine Secret named by
# /etc/wg-dialer/machine-name, which this harness does not create. That
# exercises the fallback: an unreadable adoption Secret degrades to the
# bootstrap file rather than a dead tunnel.
#
# This runs alongside the wg-dialer.service systemd unit already
# running on `cloud`, not instead of it. See
# ensureCloudDialerDaemonSet's own doc comment for why both running
# redundantly is the safety property this harness proves: the bootstrap
# unit does not depend on this DaemonSet taking over from it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dialer-cloud-repro
  namespace: wg-dialer
spec:
  selector:
    matchLabels:
      app: dialer-cloud-repro
  template:
    metadata:
      labels:
        app: dialer-cloud-repro
    spec:
      hostNetwork: true
      nodeSelector:
        cloud-provisioning.appmana.com/role: cloud-worker
      tolerations:
        - key: cloud-provisioning.appmana.com/internet-facing
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dialer
          image: busybox
          command: ["/host-bin/$DIALER_BINARY"]
          args:
            - --iface=$IFACE
            - --peers-file=/etc/wg-dialer/peers.json
            - --peers-secret-namespace=wg-dialer
            - --machine-name-file=/etc/wg-dialer/machine-name
            - --listen-port=51820
            - --pod-cidrs=$POD_CIDRS
            - --service-cidrs=$SERVICE_CIDRS
            - --keepalive-seconds=15
            - --mtu=1420
            - --poll-interval=30s
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: hostbin
              mountPath: /host-bin
            - name: wg-dialer-config
              mountPath: /etc/wg-dialer
              readOnly: true
      volumes:
        - name: hostbin
          hostPath:
            path: /opt/dialer-bin
        - name: wg-dialer-config
          hostPath:
            path: /etc/wg-dialer
            type: Directory
