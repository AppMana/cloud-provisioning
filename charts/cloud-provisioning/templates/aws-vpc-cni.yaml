{{- if .Values.platforms.aws.vpcCNI.enabled }}
{{- /*
The AWS VPC CNI's identity, as its pinned upstream chart (aws-vpc-cni 1.23.2)
renders it; the controller applies the aws-node DaemonSet and its ConfigMap
with the site's facts (controller/pkg/platform/aws). A test holds these rules
equal to upstream's.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-node
  namespace: kube-system
  labels:
    {{- include "cloud-provisioning.labels" . | nindent 4 }}
    k8s-app: aws-node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-node
  labels:
    {{- include "cloud-provisioning.labels" . | nindent 4 }}
    k8s-app: aws-node
rules:
  - apiGroups:
      - crd.k8s.amazonaws.com
    resources:
      - eniconfigs
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["list", "watch", "get"]
  - apiGroups: ["", "events.k8s.io"]
    resources:
      - events
    verbs: ["create", "patch", "list"]
  - apiGroups: ["networking.k8s.aws"]
    resources:
      - policyendpoints
      - clusterpolicyendpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.aws"]
    resources:
      - policyendpoints/status
      - clusterpolicyendpoints/status
    verbs: ["get"]
  - apiGroups:
      - vpcresources.k8s.aws
    resources:
      - cninodes
    verbs: ["get", "list", "watch", "patch"]
  - nonResourceURLs: ["/apis/networking.k8s.aws", "/apis/networking.k8s.aws/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-node
  labels:
    {{- include "cloud-provisioning.labels" . | nindent 4 }}
    k8s-app: aws-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-node
subjects:
  - kind: ServiceAccount
    name: aws-node
    namespace: kube-system
---
# The controller applies aws-node's ConfigMap in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-aws-vpc-cni
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["amazon-vpc-cni"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-provisioning.controllerName" . }}-aws-vpc-cni
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-provisioning.controllerName" . }}-aws-vpc-cni
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-provisioning.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
