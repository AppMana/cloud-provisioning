all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    bridge:
      hosts:
        clab-cldt-cldt-cloud-a:
          ansible_host: 
        clab-cldt-cldt-cloud-b:
          ansible_host: 
        clab-cldt-cldt-lan:
          ansible_host: 
        clab-cldt-cldt-wan:
          ansible_host: 
    linux:
      hosts:
        clab-cldt-bastion:
          ansible_host: 
        clab-cldt-cp:
          ansible_host: 
        clab-cldt-cp2:
          ansible_host: 
        clab-cldt-cp3:
          ansible_host: 
        clab-cldt-edge-a:
          ansible_host: 
        clab-cldt-edge-b:
          ansible_host: 
        clab-cldt-remote1:
          ansible_host: 
        clab-cldt-remote2:
          ansible_host: 
        clab-cldt-router:
          ansible_host: 
        clab-cldt-w1:
          ansible_host: 
        clab-cldt-w2:
          ansible_host: 
