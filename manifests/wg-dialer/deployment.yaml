# Only needed if --gateway-name is set (a Gateway pinned to one node via
# hostPorts has no dependable Gateway.status.addresses for external-dns
# to read; this annotation bypasses that). Must be the Gateway itself,
# not its HTTPRoutes: in external-dns's gateway.go the
# target-annotation override is read from the parent Gateway object,
# not from the route. Grant this in whatever namespace/name the
# actual Gateway lives in, and omit it if the flag is unused.
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: wg-dialer-endpoint-controller-patch-gateway
#   namespace: <gateway-namespace>
# rules:
#   - apiGroups: ["gateway.networking.k8s.io"]
#     resources: ["gateways"]
#     resourceNames: ["<gateway-name>"]
#     verbs: ["get", "patch"]
# ---
# (plus a RoleBinding to wg-dialer-endpoint-controller)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-dialer-endpoint-controller
  namespace: wg-dialer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wg-dialer-endpoint-controller
  template:
    metadata:
      labels:
        app: wg-dialer-endpoint-controller
    spec:
      serviceAccountName: wg-dialer-endpoint-controller
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          # Pin by digest. There is no default image anywhere in the
          # binary.
          image: <wg-dialer-endpoint-controller-image>@<digest>
          args:
            # Required: the binary exits immediately if any is unset.
            - --dialer-image=<wg-dialer-dialer-image>@<digest>
            - --dialer-pod-cidrs=<pod-cidr-v4>,<pod-cidr-v6>
            - --dialer-service-cidrs=<service-cidr-v4>,<service-cidr-v6>
            - --join-api-address=https://<api-address>:6443
            - --join-api-vip=<api-vip>
            - --join-node-vip4-prefix=<e.g. 10.101.0.>
            - --join-dialer-binary-url-arm64=<release binary URL>
            - --join-dialer-binary-sha256-arm64=<sha256>
            # Placement: which local nodes terminate tunnels. Empty =
            # every Linux worker; control planes are excluded unless
            # this selector names node-role.kubernetes.io/control-plane
            # explicitly. A single-node rehearsal is just
            # kubernetes.io/hostname=<node>.
            # - --tunnel-endpoints=kubernetes.io/hostname=<node>
            # - --join-node-vip6-prefix=<e.g. fd8f:cf26:522a::>
            # - --join-node-vip-start=200
            # - --gateway-namespace=<gateway-namespace>
            # - --gateway-name=<gateway-name>
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
